name: Test and deploy to GitHub Pages
on:
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  check-merge:
    runs-on: ubuntu-latest
    outputs:
      merged: ${{ steps.check.outputs.merged }}
    steps:
      - name: Check whether this commit merged a pull request
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          result=$(gh api "repos/$REPOSITORY/commits/$COMMIT_SHA/pulls" | jq --arg sha "$COMMIT_SHA" '[.[] | select(.merged_at != null and .base.ref == "main" and .merge_commit_sha == $sha)] | length')
          if [ "$result" -gt 0 ]; then
            echo "merged=true" >> "$GITHUB_OUTPUT"
          else
            echo "merged=false" >> "$GITHUB_OUTPUT"
          fi
  test-and-build:
    needs: check-merge
    if: needs.check-merge.outputs.merged == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run automated tests
        run: node --test tasks.test.js
      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html style.css app.js tasks.js _site/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
