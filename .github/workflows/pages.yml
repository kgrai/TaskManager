name: Test and deploy to GitHub Pages
on:
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  check-merge:
    runs-on: ubuntu-latest
    outputs:
      merged: ${{ steps.check.outputs.merged }}
    steps:
      - name: Check whether this commit merged a pull request
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 24); do
            result=$(gh api "repos/$REPOSITORY/commits/$COMMIT_SHA/pulls?per_page=100" | jq --arg sha "$COMMIT_SHA" '[.[] | select(.merged_at != null and .base.ref == "main" and .merge_commit_sha == $sha)] | length')
            if [ "$result" -gt 0 ]; then
              echo "Merged pull request confirmed on attempt $attempt."
              echo "merged=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Merge metadata not yet available (attempt $attempt/24)."
            if [ "$attempt" -lt 24 ]; then sleep 5; fi
          done
          echo "No merged pull request found for this commit; skipping deployment."
          echo "merged=false" >> "$GITHUB_OUTPUT"
  test-and-build:
    needs: check-merge
    if: needs.check-merge.outputs.merged == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run automated tests
        run: node --test tasks.test.js
      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html style.css app.js tasks.js _site/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
